[workspace]
members = [
  "curves/bls12_377",
  "curves/bls12_381",
  "curves/bn254",
  "curves/bw6_761",
  "curves/bw6_767",
  "curves/ed25519",
  "curves/ed_on_bls12_377",
  "curves/ed_on_bls12_381_bandersnatch",
  "curves/ed_on_bn254",
  "curves/pallas",
  "curves/secp256k1",
  "curves/vesta",
  "models",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
authors = [
  "Davide Galassi <davxy@datawok.net>",
  "Achim Schneider <achim@parity.io>",
  "Parity Technologies <admin@parity.io>",
]
repository = "https://github.com/paritytech/arkworks-extensions"
keywords = ["cryptography", "elliptic-curves", "pairing", "arkworks"]
categories = ["cryptography"]
include = ["Cargo.toml", "src", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]
license = "MIT/Apache-2.0"
edition = "2021"

[workspace.dependencies]
ark-ec = { version = "0.6", default-features = false }
ark-ff = { version = "0.6", default-features = false }
ark-std = { version = "0.6", default-features = false }
ark-serialize = { version = "0.6", default-features = false }
ark-pallas = { version = "0.6", default-features = false , features = ["curve"]}
ark-vesta = { version = "0.6", default-features = false }
ark-secp256k1 = { version = "0.6", default-features = false }
ark-bls12-377 = { version = "0.6", default-features = false, features = ["curve"] }
ark-bls12-381 = { version = "0.6", default-features = false, features = ["curve"] }
ark-bn254 = { version = "0.6", default-features = false, features = ["curve"] }
ark-bw6-761 = { version = "0.6", default-features = false }
ark-bw6-767 = { version = "0.6", default-features = false }
ark-ed-on-bls12-377 = { version = "0.6", default-features = false }
ark-ed-on-bls12-381-bandersnatch = { version = "0.6", default-features = false }
ark-ed-on-bn254 = { version = "0.6", default-features = false }
ark-ed25519 = { version = "0.6", default-features = false }
ark-algebra-test-templates = { version = "0.6", default-features = false }
ark-models-ext = { version = "0.6", path = "./models", default-features = false }
derivative = { version = "2.2", default-features = false, features = ["use_core"] }
num-traits = { version = "0.2", default-features = false }
